[workspace]
resolver = "3"
members = [
    "crates/telex-core",
    "crates/ime-core",
    "crates/fe-ibus",
    "crates/fe-fcitx",
    "crates/fe-xim",
    "crates/vr-telex",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false

[workspace.dependencies]
telex-core = { path = "crates/telex-core" }
ime-core = { path = "crates/ime-core" }
fe-ibus = { path = "crates/fe-ibus" }
fe-fcitx = { path = "crates/fe-fcitx" }
fe-xim = { path = "crates/fe-xim" }
tokio = { version = "1.54.1", default-features = false }
# Safe wrappers for prctl(PR_SET_DUMPABLE) and setrlimit, so no crate needs `unsafe` (SEC-3, SEC-27).
rustix = { version = "1.1.6", default-features = false, features = ["std", "process"] }
# Volatile wiping of text buffers (SEC-4).
zeroize = { version = "1.9.1", default-features = false, features = ["alloc"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
# Abort instead of unwinding: a panic must not run code that could format buffers.
panic = "abort"
