[workspace]
resolver = "3"
members = [
    "crates/telex-core",
    "crates/ime-core",
    "crates/fe-ibus",
    "crates/fe-fcitx",
    "crates/fe-xim",
    "crates/vr-talex",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false

[workspace.dependencies]
ime-core = { path = "crates/ime-core" }
fe-ibus = { path = "crates/fe-ibus" }
fe-fcitx = { path = "crates/fe-fcitx" }
fe-xim = { path = "crates/fe-xim" }
tokio = { version = "1.54.1", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
# Abort instead of unwinding: a panic must not run code that could format buffers.
panic = "abort"
