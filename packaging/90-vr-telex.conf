# vr-telex: input method environment for new logins (D20).
# GTK_IM_MODULE is left unset on purpose: GTK apps then use text-input-v3,
# which gnome-shell routes to vr-telex over IBus.
# QT_IM_MODULE=fcitx because Qt 5's IBus plugin needs an ibus-daemon on PATH (D27).
QT_IM_MODULE=fcitx
XMODIFIERS=@im=ibus
