name: release

# On a version tag: test, build the .deb and publish a GitHub Release with
#   vr-telex_<version>-1_amd64.deb, vr-telex-install.sh,
#   SHA256SUMS (of those two) and SHA256SUMS.asc (detached, armored signature),
#   and a signed flat apt repository for that .deb: Packages, Packages.gz,
#   Release, InRelease, Release.gpg (packaging/apt/build-flat-repo.sh).
# Users install with vr-telex-install.sh from the latest release (README >
# Install); it installs only what SHA256SUMS.asc vouches for. The package's
# apt source points at releases/latest/download/, so `apt upgrade` installs
# what the latest release's InRelease vouches for.
#
# Needs the secret APT_GPG_PRIVATE_KEY (armored secret key whose fingerprint
# matches packaging/apt/vr-telex.asc) and, if that key has one,
# APT_GPG_PASSPHRASE, both in the GitHub environment apt-release: only the
# publish job names that environment, so no other job or workflow can read
# them, and the environment rules (v* tags, owner review) gate the publish.
# A tag whose commit is not on master is refused before anything is built.
# Setup and key renewal: packaging/get/RELEASING.md.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # No secrets and a read-only token: everything that compiles or runs
    # project code happens here.
    permissions:
      contents: read
    outputs:
      deb: ${{ steps.deb.outputs.deb }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Refuse a tag that is not on master
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/master:refs/remotes/origin/master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master ||
            { echo "::error::tag $TAG points at $GITHUB_SHA, which is not on master"; exit 1; }

      # libglib2.0-bin, gsettings-desktop-schemas, python3-gi and gir1.2-glib-2.0:
      # tests/install/run.sh (see test.yml). gpg, gpgv, wget, curl: tests/get/run.sh.
      # apt-utils (apt-ftparchive): tests/apt/run.sh.
      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends dbus-daemon gpg gpgv shellcheck wget curl apt-utils \
            libglib2.0-bin gsettings-desktop-schemas python3-gi gir1.2-glib-2.0
          rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update
          cargo install cargo-deb --locked --version 3.8.0

      - name: Format, lint, test
        run: |
          cargo fmt --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          shellcheck -x packaging/get/vr-telex-install.sh packaging/get/embed-key.sh tests/get/run.sh \
            tests/deb/run.sh tests/apt/run.sh packaging/apt/build-flat-repo.sh install.sh uninstall.sh \
            packaging/vr-telex-setup packaging/deb/postinst packaging/deb/prerm packaging/deb/postrm
          shellcheck -x -S warning -e SC2034,SC2174 packaging/common.sh # see test.yml
          cargo test --workspace --locked

      - name: Install and setup scenarios
        run: bash tests/install/run.sh

      - name: Build the .deb
        id: deb
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag $TAG is not vMAJOR.MINOR.PATCH"; exit 1; }
          cargo deb -p vr-telex --locked
          shopt -s nullglob
          debs=(target/debian/vr-telex_*_amd64.deb)
          [ "${#debs[@]}" -eq 1 ] || { echo "::error::expected one .deb, found ${#debs[@]}"; exit 1; }
          want="vr-telex_${TAG#v}-1_amd64.deb"
          [ "$(basename "${debs[0]}")" = "$want" ] ||
            { echo "::error::built $(basename "${debs[0]}"), tag $TAG needs $want (bump the workspace version)"; exit 1; }
          echo "deb=$want" >>"$GITHUB_OUTPUT"

      - name: Package and install script tests
        env:
          DEB: target/debian/${{ steps.deb.outputs.deb }}
        run: |
          VR_TELEX_DEB_STRICT=1 bash tests/deb/run.sh "$DEB"
          bash tests/get/run.sh
          bash tests/apt/run.sh "$DEB"

      - name: Collect the release files
        env:
          DEB: target/debian/${{ steps.deb.outputs.deb }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          cp "$DEB" packaging/get/vr-telex-install.sh "$RUNNER_TEMP/release/"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    # Secrets come from this environment only; its rules allow v* tags and
    # need the owner's approval.
    environment: apt-release
    timeout-minutes: 15
    permissions:
      contents: write # create the release and upload its files
    concurrency:
      group: publish-release
      cancel-in-progress: false
    steps:
      # Only for packaging/apt/vr-telex.asc; gh uses GH_TOKEN, not git.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release

      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends gpg gpgv apt-utils

      # Never add `set -x` or echo the key variables in this step.
      - name: Write and sign SHA256SUMS and the apt repository
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
          DEB: ${{ needs.build.outputs.deb }}
        run: |
          set -euo pipefail
          [ -n "$APT_GPG_PRIVATE_KEY" ] || { echo "::error::secret APT_GPG_PRIVATE_KEY is not set"; exit 1; }
          REL="$RUNNER_TEMP/release"
          if [ ! -f "$REL/$DEB" ] || [ ! -f "$REL/vr-telex-install.sh" ] || [ "$(find "$REL" -mindepth 1 | wc -l)" != 2 ]; then
            echo "::error::unexpected release files: $(ls "$REL")"
            exit 1
          fi
          umask 077
          GNUPGHOME=$(mktemp -d "$RUNNER_TEMP/gnupg.XXXXXX")
          export GNUPGHOME
          cleanup() {
            gpgconf --kill gpg-agent || true
            rm -rf -- "$GNUPGHOME"
          }
          trap cleanup EXIT
          printf '%s\n' "$APT_GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          unset APT_GPG_PRIVATE_KEY
          # Sign only with the key the install script pins.
          gpg --batch --yes --dearmor --output "$GNUPGHOME/pinned.gpg" packaging/apt/vr-telex.asc
          FPR=$(gpg --batch --show-keys --with-colons "$GNUPGHOME/pinned.gpg" | awk -F: '/^fpr/ { print $10; exit }')
          [ "$FPR" = 2C30E91F97E5A566BEFF373736C30B9165329B85 ] ||
            { echo "::error::packaging/apt/vr-telex.asc is not the release key"; exit 1; }
          gpg --batch --with-colons --list-secret-keys -- "$FPR" >/dev/null 2>&1 ||
            { echo "::error::APT_GPG_PRIVATE_KEY is not the key of packaging/apt/vr-telex.asc"; exit 1; }
          umask 022
          (cd "$REL" && sha256sum -- "$DEB" vr-telex-install.sh >SHA256SUMS)
          # Loopback mode with the passphrase (empty when unset) on a pipe:
          # never a prompt, and a wrong or missing passphrase fails.
          printf '%s' "${APT_GPG_PASSPHRASE:-}" |
            gpg --batch --yes --no-tty --pinentry-mode loopback --passphrase-fd 0 \
              --local-user "$FPR!" --armor --detach-sign --output "$REL/SHA256SUMS.asc" "$REL/SHA256SUMS"
          # What the install script checks: the signature with the pinned key
          # alone, then the hashes.
          PINNED="$GNUPGHOME/pinned.gpg"
          mkdir -m 700 "$GNUPGHOME/verify"
          GNUPGHOME="$GNUPGHOME/verify" gpgv --keyring "$PINNED" "$REL/SHA256SUMS.asc" "$REL/SHA256SUMS"
          (cd "$REL" && sha256sum --strict -c SHA256SUMS)
          # The flat apt repository the package's source reads (same key, same
          # passphrase pipe); the script checks both signatures with the pinned
          # key before writing Packages, Packages.gz, Release, InRelease and
          # Release.gpg beside the .deb.
          APT_GPG_KEY="$FPR" bash packaging/apt/build-flat-repo.sh "$REL/$DEB" "$REL"
          unset APT_GPG_PASSPHRASE
          [ "$(find "$REL" -mindepth 1 | wc -l)" = 9 ] ||
            { echo "::error::unexpected release files: $(ls "$REL")"; exit 1; }

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEB: ${{ needs.build.outputs.deb }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/release"
          files=("$DEB" vr-telex-install.sh SHA256SUMS SHA256SUMS.asc Packages Packages.gz Release InRelease Release.gpg)
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A re-run over an existing release. Assets are replaced one by one,
            # so the .deb already published under this name must stay the same
            # bytes: then Packages and Packages.gz are the same bytes too, the
            # old and new InRelease list the same hashes, and no client sees a
            # mismatch at any point. A rebuilt .deb (a full workflow re-run)
            # differs and is refused: re-run only this job, which reuses the
            # build artifact, or bump the version (packaging/get/RELEASING.md).
            assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
            if grep -qxF -- "$DEB" <<<"$assets"; then
              mkdir -p "$RUNNER_TEMP/published"
              gh release download "$TAG" --pattern "$DEB" --dir "$RUNNER_TEMP/published" --clobber
              cmp -s -- "$RUNNER_TEMP/published/$DEB" "$DEB" ||
                { echo "::error::$TAG already publishes a different $DEB; re-run only the publish job, or bump the version"; exit 1; }
            fi
            # InRelease last: it never names a file that is not uploaded yet.
            gh release upload "$TAG" "$DEB" vr-telex-install.sh SHA256SUMS SHA256SUMS.asc Packages Packages.gz --clobber
            gh release upload "$TAG" Release Release.gpg --clobber
            gh release upload "$TAG" InRelease --clobber
          else
            gh release create "$TAG" "${files[@]}" --verify-tag --title "vr-telex ${TAG#v}" \
              --notes "Install: see README.md (Install). Update: sudo apt update && sudo apt upgrade. SHA256SUMS and the apt repository (InRelease) are signed with the key in packaging/apt/vr-telex.asc."
          fi
