name: release

# On a version tag: test, build the .deb, publish it to the signed apt
# repository on the gh-pages branch (older versions stay in the pool) and
# attach it to the GitHub Release.
#
# Needs the secret APT_GPG_PRIVATE_KEY (armored secret key whose fingerprint
# matches packaging/apt/vr-telex.asc) and, if that key has one,
# APT_GPG_PASSPHRASE, both in the GitHub environment apt-release: only the
# publish job names that environment, so no other job or workflow can read
# them, and the environment rules (v* tags, owner review) gate the publish.
# A tag whose commit is not on master is refused before anything is built.
# GitHub Pages serves the gh-pages branch (root). Setup: tools/apt-repo/README.md.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # No secrets and a read-only token: everything that compiles or runs
    # project code happens here.
    permissions:
      contents: read
    outputs:
      deb: ${{ steps.deb.outputs.deb }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Refuse a tag that is not on master
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/master:refs/remotes/origin/master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master ||
            { echo "::error::tag $TAG points at $GITHUB_SHA, which is not on master"; exit 1; }

      # libglib2.0-bin, gsettings-desktop-schemas, python3-gi and gir1.2-glib-2.0:
      # tests/install/run.sh (see test.yml).
      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends apt-utils dbus-daemon gpg gpgv shellcheck \
            libglib2.0-bin gsettings-desktop-schemas python3-gi gir1.2-glib-2.0
          rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update
          cargo install cargo-deb --locked --version 3.8.0

      - name: Format, lint, test
        run: |
          cargo fmt --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          shellcheck -x tools/apt-repo/build.sh tests/apt/run.sh tests/deb/run.sh install.sh uninstall.sh \
            packaging/vr-telex-setup packaging/deb/postinst packaging/deb/prerm packaging/deb/postrm
          shellcheck -x -S warning -e SC2034,SC2174 packaging/common.sh # see test.yml
          cargo test --workspace --locked

      - name: Install and setup scenarios
        run: bash tests/install/run.sh

      - name: Build the .deb
        id: deb
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag $TAG is not vMAJOR.MINOR.PATCH"; exit 1; }
          cargo deb -p vr-telex --locked
          shopt -s nullglob
          debs=(target/debian/vr-telex_*_amd64.deb)
          [ "${#debs[@]}" -eq 1 ] || { echo "::error::expected one .deb, found ${#debs[@]}"; exit 1; }
          want="vr-telex_${TAG#v}-1_amd64.deb"
          [ "$(basename "${debs[0]}")" = "$want" ] ||
            { echo "::error::built $(basename "${debs[0]}"), tag $TAG needs $want (bump the workspace version)"; exit 1; }
          echo "deb=$want" >>"$GITHUB_OUTPUT"

      - name: Package and repository tests
        env:
          DEB: target/debian/${{ steps.deb.outputs.deb }}
        run: |
          VR_TELEX_DEB_STRICT=1 bash tests/deb/run.sh "$DEB"
          bash tests/apt/run.sh "$DEB"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb
          path: target/debian/${{ steps.deb.outputs.deb }}
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    # Secrets come from this environment only; its rules allow v* tags and
    # need the owner's approval.
    environment: apt-release
    timeout-minutes: 15
    permissions:
      contents: write # push gh-pages, create the release
    concurrency:
      group: publish-apt
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deb
          path: ${{ runner.temp }}/deb

      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends apt-utils gpg gpgv

      # Never add `set -x` or echo the key variables in this step.
      - name: Sign and publish the apt repository (gh-pages)
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
          DEB: ${{ runner.temp }}/deb/${{ needs.build.outputs.deb }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [ -n "$APT_GPG_PRIVATE_KEY" ] || { echo "::error::secret APT_GPG_PRIVATE_KEY is not set"; exit 1; }
          umask 077
          GNUPGHOME=$(mktemp -d "$RUNNER_TEMP/gnupg.XXXXXX")
          export GNUPGHOME
          cleanup() {
            gpgconf --kill gpg-agent || true
            rm -rf -- "$GNUPGHOME"
          }
          trap cleanup EXIT
          printf '%s\n' "$APT_GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          unset APT_GPG_PRIVATE_KEY
          # Sign only with the key users were told to trust.
          APT_GPG_KEY=$(gpg --batch --show-keys --with-colons packaging/apt/vr-telex.asc | awk -F: '/^fpr/ { print $10; exit }')
          export APT_GPG_KEY
          umask 022

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch --no-tags --depth=1 origin +refs/heads/gh-pages:refs/remotes/origin/gh-pages
            git worktree add -B gh-pages "$RUNNER_TEMP/site" origin/gh-pages
          else
            git worktree add --orphan -b gh-pages "$RUNNER_TEMP/site"
          fi
          bash tools/apt-repo/build.sh "$DEB" "$RUNNER_TEMP/site"
          unset APT_GPG_PASSPHRASE
          touch "$RUNNER_TEMP/site/.nojekyll"
          cd "$RUNNER_TEMP/site"
          git add -A
          if git diff --cached --quiet; then
            echo "gh-pages already holds this release"
          else
            git commit -q -m "Publish vr-telex ${TAG#v}"
            git push origin gh-pages
          fi

      - name: Attach the .deb to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          DEB: ${{ runner.temp }}/deb/${{ needs.build.outputs.deb }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DEB" --clobber
          else
            gh release create "$TAG" "$DEB" --verify-tag --title "vr-telex ${TAG#v}" \
              --notes "Install with apt: see README.md (Install). The .deb is also in the apt repository at https://mvanvu.github.io/vr-telex."
          fi
